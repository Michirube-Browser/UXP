<!DOCTYPE html [
  <!ENTITY % htmlDTD
    PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "DTD/xhtml1-strict.dtd">
  %htmlDTD;
  <!ENTITY % globalDTD SYSTEM "chrome://global/locale/global.dtd">
  %globalDTD;
  <!ENTITY % aboutHomeDTD SYSTEM "chrome://browser/locale/aboutHome.dtd">
  %aboutHomeDTD;
  <!ENTITY % browserDTD SYSTEM "chrome://browser/locale/browser.dtd" >
  %browserDTD;
]>

<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8"/>
    <title>&abouthome.pageTitle;</title>
    <base href="chrome://browser/content/abouthome/"/>
    <link rel="stylesheet" href="chrome://browser/content/abouthome/pager/style.css"/>
    <link rel="stylesheet" href="chrome://browser/content/abouthome/pager/clock.css"/>
  </head>

  <body dir="&locale.dir;">
    <main>
      <section class="top"><div id="time"></div><div id="date"></div></section>
      <form id="search" role="search">
        <select id="engine" aria-label="Search engine">
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://www.startpage.com/sp/search?query=">Startpage</option>
          <option value="https://www.ecosia.org/search?q=">Ecosia</option>
          <option value="https://www.google.com/search?q=">Google</option>
        </select>
        <input id="q" type="text" placeholder="Search the web" autocomplete="off" spellcheck="false" aria-label="Search" autofocus="autofocus"/>
        <button type="submit" aria-label="Search"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg></button>
      </form>
    </main>

    <script src="chrome://browser/content/abouthome/pager/main.js"></script>
  </body>
</html>
